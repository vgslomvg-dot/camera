name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 requests kivy

      - name: Build APK via p4s
        run: |
          p4s create --private . --package=org.test.camerabackup --name="Camera Backup" --version=0.1 --bootstrap=sdl2 --requirements=python3,kivy,requests --orientation=portrait --permissions=INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE --arch=arm64-v8a --sdk-dir=/home/runner/.buildozer/android/platform/android-sdk --ndk-dir=/home/runner/.buildozer/android/platform/android-ndk-r25b || python3 -m pythonforandroid.toolchain create --private . --package=org.test.camerabackup --name="Camera Backup" --version=0.1 --bootstrap=sdl2 --requirements=python3,kivy,requests --dir=.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
